{% extends 'tiendaApp/base.html' %}

{% block title %}Sesión Cerrada{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow text-center">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">Sesión Cerrada</h4>
            </div>
            <div class="card-body">
                <p class="lead">Has cerrado sesión exitosamente.</p>
                <p>Gracias por usar el Sistema de Empleados.</p>
                <div class="mt-4">
                    <a href="{% url 'inicio' %}" class="btn btn-primary">Volver al Inicio</a>
                    <a href="{% url 'login' %}" class="btn btn-outline-primary">Iniciar Sesión Nuevamente</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
